<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Login - CBC Competency Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>Teacher Login</h2>
      <p>Sign in to open the CBC competency platform.</p>
      <form id="loginForm" class="login-form">
        <label>Username<input id="loginUsername" required autocomplete="username" /></label>
        <label>Password<input id="loginPassword" type="password" required autocomplete="current-password" /></label>
        <button type="submit">Login</button>
      </form>
      <p class="login-hint"><strong>Default credentials:</strong> admin / CBC2026</p>
      <p id="loginError" class="login-error" aria-live="polite"></p>
    </div>
  </section>

  <script>
    const AUTH = { username: 'admin', defaultPassword: 'CBC2026', passwordKey: 'cbcPassword', passwordUpdatedFlagKey: 'cbcPasswordUpdated', sessionKey: 'cbcLoggedIn' };

    function isAuthenticated() {
      return localStorage.getItem(AUTH.sessionKey) === 'true';
    }

    if (isAuthenticated()) {
      window.location.replace('index.html');
    }

    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorEl = document.getElementById('loginError');

      const storedPassword = (localStorage.getItem(AUTH.passwordKey) || AUTH.defaultPassword).trim();
      if (username === AUTH.username && password === storedPassword) {
        localStorage.setItem(AUTH.sessionKey, 'true');
        window.location.replace('index.html');
        return;
      }

      const updatedFlag = localStorage.getItem(AUTH.passwordUpdatedFlagKey) === 'true';
      errorEl.textContent = updatedFlag
        ? 'Invalid credentials. Use your updated password.'
        : 'Invalid credentials. Use admin / CBC2026.';
    });
  </script>
</body>
</html>
